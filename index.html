<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 자기소개 페이지</title>
  <style>
    body {
      font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 85vh;
      margin: 0;
    }
    .profile-card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 36px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    .badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    h1 {
      color: #202124;
      font-size: 26px;
      margin: 0 0 8px 0;
    }
    .subtitle {
      color: #5f6368;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .info-box {
      background: #f8f9fa;
      padding: 16px 20px;
      border-radius: 12px;
      line-height: 1.9;
      color: #3c4043;
    }
    ul {
      margin: 8px 0 0 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>
<div class="profile-card">
  <span class="badge">New Developer</span>
  <h1>안녕하세요, 홍길동입니다! 👋</h1>
  <p class="subtitle">꾸준히 배우고 기록하며 동료들과 함께 성장하는 개발자가 되고 싶습니다.</p>

  <div class="info-box">
    <strong>📌 나를 소개합니다</strong>
    <ul>
      <li><strong>관심 분야:</strong> 웹 서비스 개발, 백엔드</li>
      <li><strong>개발 환경:</strong> IntelliJ IDEA, Git, GitHub</li>
      <li><strong>취미/특기:</strong> 음악 감상, 새로운 IT 기술 찾아보기</li>
      <li><strong>나의 각오:</strong> 기본기를 탄탄히 다져 팀에 보탬이 되겠습니다!</li>
    </ul>
  </div>
</div>
</body>
</html>
